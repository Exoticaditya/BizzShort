services:
  - type: web
    name: bizzshort
    env: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false  # Set in Render dashboard — do NOT commit credentials
      - key: JWT_SECRET
        sync: false  # Set in Render dashboard
      - key: JWT_EXPIRE
        value: 30d
      - key: CORS_ORIGIN
        value: https://bizzshort.com,https://www.bizzshort.com,https://bizzshort.onrender.com
      - key: CURRENTS_API_KEY
        sync: false  # Set in Render dashboard
      - key: YT_API_KEY
        sync: false  # Set in Render dashboard
      - key: YT_CHANNEL_ID
        sync: false  # Set in Render dashboard

